<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <linearGradient id="bgSuppliesGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14532d"/>
      <stop offset="100%" stop-color="#052e16"/>
    </linearGradient>
    <filter id="suppliesShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#22c55e" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Background Card -->
  <rect x="20" y="20" width="560" height="360" rx="16" fill="url(#bgSuppliesGrad)" stroke="#22c55e" stroke-width="2" filter="url(#suppliesShadow)"/>

  <!-- Watermark: SAMPLE / DUMMY -->
  <text x="300" y="240" fill="#22c55e" fill-opacity="0.08" font-family="'Inter', -apple-system, sans-serif" font-size="70" font-weight="900" text-anchor="middle" transform="rotate(-15 300 240)">SAMPLE / DUMMY</text>

  <!-- Dummy Badge Top Right -->
  <rect x="420" y="38" width="130" height="26" rx="6" fill="#22c55e" fill-opacity="0.2" stroke="#22c55e" stroke-width="1.5"/>
  <text x="485" y="55" fill="#4ade80" font-family="'Inter', sans-serif" font-size="11" font-weight="800" text-anchor="middle">⚠️ 検証用ダミー画像</text>

  <!-- Header -->
  <text x="50" y="65" fill="#22c55e" font-family="'Inter', -apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="800" letter-spacing="2">TAX INVOICE [FICTIONAL SAMPLE]</text>
  <text x="50" y="100" fill="#f8fafc" font-family="'Inter', -apple-system, BlinkMacSystemFont, sans-serif" font-size="20" font-weight="800">【架空文具】サンプルオフィスサプライ【ダミー】</text>
  <line x1="50" y1="120" x2="550" y2="120" stroke="#166534" stroke-width="1.5"/>

  <!-- Details -->
  <text x="50" y="155" fill="#86efac" font-family="'Inter', sans-serif" font-size="13">発行日: 2026年09月18日 / 領収証番号: DUMMY-ST-88901</text>
  <text x="50" y="180" fill="#86efac" font-family="'Inter', sans-serif" font-size="13">購入明細: 【架空】エルゴノミクスマウス, USB-C高速ハブ, A4コピー用紙 5束</text>
  <text x="50" y="205" fill="#86efac" font-family="'Inter', sans-serif" font-size="13">用途: 開発検証環境整備に伴うPC周辺アクセサリ及び日常事務用品の補充</text>

  <!-- Items Box -->
  <rect x="50" y="225" width="500" height="60" rx="8" fill="#052e16" stroke="#15803d" stroke-width="1"/>
  <text x="70" y="250" fill="#f0fdf4" font-family="'Inter', sans-serif" font-size="14" font-weight="600">但し: 業務開発用PC周辺機器および事務用品消耗品費として</text>
  <text x="70" y="270" fill="#86efac" font-family="'Inter', sans-serif" font-size="12">区分: 消耗品費 / 経費精算申請書 添付用 (※AI判定検証用ダミー)</text>

  <!-- Total Amount -->
  <text x="50" y="330" fill="#86efac" font-family="'Inter', sans-serif" font-size="14">合計金額 (税込):</text>
  <text x="180" y="335" fill="#4ade80" font-family="'Inter', sans-serif" font-size="30" font-weight="900">¥14,850-</text>

  <!-- Notice footer -->
  <text x="50" y="362" fill="#4ade80" fill-opacity="0.8" font-family="'Inter', sans-serif" font-size="10">※ 本画像は動作確認用の架空・ダミーデータです。実在の店舗・人物・団体とは一切関係ありません。</text>

  <!-- Stamp -->
  <rect x="460" y="295" width="80" height="55" rx="6" fill="#15803d" fill-opacity="0.2" stroke="#22c55e" stroke-width="1.5"/>
  <text x="500" y="322" fill="#4ade80" font-family="'Inter', sans-serif" font-size="12" font-weight="800" text-anchor="middle">サンプル</text>
  <text x="500" y="338" fill="#4ade80" font-family="'Inter', sans-serif" font-size="11" font-weight="700" text-anchor="middle">受領済</text>
</svg>

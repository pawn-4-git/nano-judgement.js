<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background Card -->
  <rect x="20" y="20" width="560" height="360" rx="16" fill="url(#bgGrad)" stroke="#38bdf8" stroke-width="2" filter="url(#shadow)"/>

  <!-- Watermark / Decorative Icon -->
  <circle cx="510" cy="90" r="50" fill="#38bdf8" fill-opacity="0.06"/>
  <path d="M490 90 L510 70 L530 90 L520 90 L520 110 L500 110 L500 90 Z" fill="#38bdf8" fill-opacity="0.2"/>

  <!-- Header -->
  <text x="50" y="70" fill="#38bdf8" font-family="'Inter', -apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="700" letter-spacing="2">ELECTRONIC INVOICE / RECEIPT</text>
  <text x="50" y="105" fill="#f8fafc" font-family="'Inter', -apple-system, BlinkMacSystemFont, sans-serif" font-size="24" font-weight="800">領収書 (Cloud Infrastructure)</text>
  <line x1="50" y1="125" x2="550" y2="125" stroke="#334155" stroke-width="1.5"/>

  <!-- Details -->
  <text x="50" y="160" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="13">発行元: クラウドホスティング株式会社 (Cloud Lab Corp.)</text>
  <text x="50" y="185" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="13">宛名: 株式会社テクノロジー・ソリューションズ 御中</text>
  <text x="50" y="210" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="13">発行日: 2026年09月15日 / No. INV-202609-8842</text>

  <!-- Items Box -->
  <rect x="50" y="230" width="500" height="60" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
  <text x="70" y="255" fill="#e2e8f0" font-family="'Inter', sans-serif" font-size="14" font-weight="600">但し: AWS / クラウドサーバー本番環境月額利用料 (EC2/RDS) 及び 保守管理費用として</text>
  <text x="70" y="275" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="12">適用期間: 2026/08/01 - 2026/08/31 (100% 稼働 SLA 達成)</text>

  <!-- Total Amount -->
  <text x="50" y="335" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="14">ご請求金額 (税込):</text>
  <text x="190" y="340" fill="#38bdf8" font-family="'Inter', sans-serif" font-size="30" font-weight="900">¥128,400-</text>

  <!-- Stamp -->
  <rect x="460" y="295" width="80" height="55" rx="6" fill="#dc2626" fill-opacity="0.1" stroke="#ef4444" stroke-width="1.5"/>
  <text x="500" y="328" fill="#ef4444" font-family="'Inter', sans-serif" font-size="13" font-weight="700" text-anchor="middle">領収済</text>
</svg>

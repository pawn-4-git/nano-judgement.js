<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <linearGradient id="bgCafeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#292524"/>
      <stop offset="100%" stop-color="#1c1917"/>
    </linearGradient>
    <filter id="cafeShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#f59e0b" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Background Card -->
  <rect x="20" y="20" width="560" height="360" rx="16" fill="url(#bgCafeGrad)" stroke="#f59e0b" stroke-width="2" filter="url(#cafeShadow)"/>

  <!-- Coffee Icon -->
  <circle cx="510" cy="85" r="40" fill="#f59e0b" fill-opacity="0.1"/>
  <text x="510" y="98" fill="#f59e0b" font-family="'Inter', sans-serif" font-size="36" text-anchor="middle">☕</text>

  <!-- Header -->
  <text x="50" y="70" fill="#f59e0b" font-family="'Inter', -apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="700" letter-spacing="2">OFFICIAL RECEIPT / 会計レシート</text>
  <text x="50" y="105" fill="#f8fafc" font-family="'Inter', -apple-system, BlinkMacSystemFont, sans-serif" font-size="24" font-weight="800">スターライト・カフェ 渋谷店 (Cafe Receipt)</text>
  <line x1="50" y1="125" x2="550" y2="125" stroke="#44403c" stroke-width="1.5"/>

  <!-- Details -->
  <text x="50" y="160" fill="#a8a29e" font-family="'Inter', sans-serif" font-size="13">日時: 2026年09月20日 15:30 / 伝票番号: #9042</text>
  <text x="50" y="185" fill="#a8a29e" font-family="'Inter', sans-serif" font-size="13">用途: クライアント企業担当者様との新規案件要件定義・打ち合わせ喫茶代</text>
  <text x="50" y="210" fill="#a8a29e" font-family="'Inter', sans-serif" font-size="13">参加人数: 2名 (ブレンドコーヒー × 2, 本日のスイーツセット × 1)</text>

  <!-- Items Box -->
  <rect x="50" y="230" width="500" height="60" rx="8" fill="#1c1917" stroke="#57534e" stroke-width="1"/>
  <text x="70" y="255" fill="#e7e5e4" font-family="'Inter', sans-serif" font-size="14" font-weight="600">但し: 外部パートナーとの商談・打合せ費用として（会議費・交際費）</text>
  <text x="70" y="275" fill="#a8a29e" font-family="'Inter', sans-serif" font-size="12">支払方法: クレジットカード一括払い (Corp Card)</text>

  <!-- Total Amount -->
  <text x="50" y="335" fill="#a8a29e" font-family="'Inter', sans-serif" font-size="14">合計金額 (税込):</text>
  <text x="180" y="340" fill="#fbbf24" font-family="'Inter', sans-serif" font-size="30" font-weight="900">¥2,480-</text>

  <!-- Stamp -->
  <rect x="460" y="295" width="80" height="55" rx="6" fill="#f59e0b" fill-opacity="0.1" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="500" y="328" fill="#fbbf24" font-family="'Inter', sans-serif" font-size="13" font-weight="700" text-anchor="middle">受領済</text>
</svg>
